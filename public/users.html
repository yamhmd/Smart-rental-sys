<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Rental | User management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="users">
  <main class="dashboard-layout">
    <aside class="sidebar">
      <div>
        <a class="brand" href="index.html" style="margin-bottom:24px; display:flex;">
          <span class="brand-mark">📈</span>
          <span>Admin</span>
        </a>
        <nav class="sidebar-menu">
          <a class="sidebar-link" href="admin.html">Overview</a>
          <a class="sidebar-link" href="dashboard.html">Manager dashboard</a>
          <a class="sidebar-link active" href="users.html">Users</a>
          <a class="sidebar-link" href="properties.html">Properties</a>
          <a class="sidebar-link" href="#" data-logout>Sign out</a>
        </nav>
      </div>
      <div class="sidebar-user">
        <span class="avatar">AD</span>
        <div>
          <strong data-user-name>Administrator</strong>
          <div class="muted">Admin</div>
        </div>
      </div>
    </aside>

    <section class="dashboard-main">
      <div class="dashboard-topbar">
        <div>
          <h1>User management</h1>
          <p>View and update accounts in the <code>Users</code> table. Password changes are bcrypt-hashed on the server.</p>
        </div>
      </div>

      <div class="status-msg" data-users-status style="margin-bottom: 16px;"></div>

      <article class="data-card">
        <div class="card-head"><strong>All users</strong><span class="muted">Admin only</span></div>
        <div class="table-wrap" style="margin-top: 12px;">
          <table class="table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Name</th>
                <th>Role</th>
                <th>Created</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody data-users-table-body>
              <tr><td colspan="6" class="muted">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </article>
    </section>
  </main>

  <div class="modal-overlay" data-user-modal hidden>
    <div class="modal-card">
      <h3>Edit user</h3>
      <form class="form-grid" data-user-edit-form>
        <div>
          <label class="label" for="editEmail">Email</label>
          <input class="input" id="editEmail" name="email" type="email" required autocomplete="off">
        </div>
        <div>
          <label class="label" for="editName">Full name</label>
          <input class="input" id="editName" name="full_name" required autocomplete="name">
        </div>
        <div>
          <label class="label" for="editRole">Role</label>
          <select class="input" id="editRole" name="role">
            <option value="tenant">tenant</option>
            <option value="manager">manager</option>
            <option value="admin">admin</option>
          </select>
        </div>
        <div>
          <label class="label" for="editPassword">New password</label>
          <input class="input" id="editPassword" name="password" type="password" placeholder="Leave blank to keep current" autocomplete="new-password">
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-light" data-close-modal>Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/users-admin.js"></script>
</body>
</html>
